<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kıble Bulucu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0f1f1b;--panel:#16302a;--ink:#eef3ef;--mute:#8fa89f;--gold:#e0b84f;--ok:#3ddc97;--bad:#ff6b5e}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#map{flex:1 1 50%;min-height:200px;background:#0b1512}
#panel{flex:0 0 auto;background:var(--panel);padding:12px 14px 14px;display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
#dial{width:150px;height:150px}
.rows{display:grid;gap:6px;font-size:14px}
.row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #ffffff14;padding-bottom:4px}
.row b{font-variant-numeric:tabular-nums;font-size:16px}
.row span{color:var(--mute)}
#status{grid-column:1/-1;text-align:center;font-size:18px;font-weight:600;padding:8px;border-radius:10px;background:#0f1f1b;color:var(--mute);transition:background .2s,color .2s}
#status.ok{background:var(--ok);color:#06251a}
#status.warn{color:var(--gold)}
.tools{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute)}
.tools button,.tools input{font:inherit}
.tools button{background:#0f1f1b;color:var(--ink);border:1px solid #ffffff22;border-radius:8px;padding:7px 10px}
.tools input{width:64px;background:#0f1f1b;color:var(--ink);border:1px solid #ffffff22;border-radius:8px;padding:6px}
#start{position:fixed;inset:0;z-index:2000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#start h1{margin:0;font-size:28px}
#start p{margin:0;max-width:34ch;color:var(--mute);line-height:1.5}
#startBtn{background:var(--gold);color:#241b00;border:0;border-radius:12px;padding:14px 28px;font-size:18px;font-weight:700}
#err{color:var(--bad);min-height:1.2em;max-width:34ch}
.me{position:relative;width:44px;height:44px}
.me .cone{position:absolute;inset:0;transform-origin:50% 50%}
.me .dot{position:absolute;left:15px;top:15px;width:14px;height:14px;border-radius:50%;background:#2f8cff;border:2px solid #fff;box-shadow:0 0 0 2px #2f8cff55}
.kaaba{width:22px;height:22px;background:#111;border:2px solid var(--gold);border-radius:3px}
@media (max-width:360px){#panel{grid-template-columns:1fr}#dial{margin:auto}}
</style>
</head>
<body>
<div id="start">
  <h1>Kıble Bulucu</h1>
    <p>Konum ve pusula izni gerekiyor. Telefonu yere paralel tut, çevrendeki metal ve mıknatıslardan uzaklaş.</p>
      <button id="startBtn">Başla</button>
        <div id="err"></div>
        </div>

        <div id="map"></div>

        <div id="panel">
          <svg id="dial" viewBox="-100 -100 200 200" aria-label="Pusula">
              <circle r="96" fill="#0f1f1b" stroke="#ffffff22" stroke-width="2"/>
                  <g id="ring">
                        <g stroke="#8fa89f" stroke-width="2">
                                <path d="M0-96v10M0 96v-10M-96 0h10M96 0h-10"/>
                                      </g>
                                            <text y="-70" text-anchor="middle" fill="#ff6b5e" font-size="18" font-weight="700">K</text>
                                                  <text y="82" text-anchor="middle" fill="#8fa89f" font-size="14">G</text>
                                                        <text x="76" y="5" text-anchor="middle" fill="#8fa89f" font-size="14">D</text>
                                                              <text x="-76" y="5" text-anchor="middle" fill="#8fa89f" font-size="14">B</text>
                                                                    <g id="qmark"><rect x="-9" y="-92" width="18" height="18" rx="3" fill="#111" stroke="#e0b84f" stroke-width="2.5"/><path d="M0-74V0" stroke="#e0b84f" stroke-width="1.5" stroke-dasharray="3 4" opacity=".7"/></g>
                                                                        </g>
                                                                            <path d="M0-100l8 16h-16z" fill="#eef3ef"/>
                                                                                <circle r="4" fill="#eef3ef"/>
                                                                                  </svg>
                                                                                    <div class="rows">
                                                                                        <div class="row"><span>Kıble yönü</span><b id="qb">—</b></div>
                                                                                            <div class="row"><span>Telefon yönü</span><b id="hd">—</b></div>
                                                                                                <div class="row"><span>Fark</span><b id="df">—</b></div>
                                                                                                    <div class="row"><span>Kâbe'ye</span><b id="ds">—</b></div>
                                                                                                        <div class="row"><span>Konum hassasiyeti</span><b id="ac">—</b></div>
                                                                                                          </div>
                                                                                                            <div id="status">Konum bekleniyor…</div>
                                                                                                              <div class="tools">
                                                                                                                  <label>Manyetik sapma (°, doğu +) <input id="decl" type="number" step="0.1" value="5"></label>
                                                                                                                      <button id="center">Bana odaklan</button>
                                                                                                                          <button id="both">Kâbe'yi de göster</button>
                                                                                                                              <button id="layer">Uydu</button>
                                                                                                                                </div>
                                                                                                                                </div>

                                                                                                                                <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
                                                                                                                                <script>
                                                                                                                                const KAABA = {lat:21.422487, lon:39.826206};
                                                                                                                                const R2D = 180/Math.PI, D2R = Math.PI/180;
                                                                                                                                const $ = id => document.getElementById(id);
                                                                                                                                const norm = a => ((a%360)+360)%360;
                                                                                                                                const sdiff = a => ((a+540)%360)-180;           // -180..180

                                                                                                                                // ---------- Hesaplamalar ----------
                                                                                                                                function bearing(lat1,lon1,lat2,lon2){
                                                                                                                                  const p1=lat1*D2R,p2=lat2*D2R,dl=(lon2-lon1)*D2R;
                                                                                                                                    const y=Math.sin(dl)*Math.cos(p2);
                                                                                                                                      const x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
                                                                                                                                        return norm(Math.atan2(y,x)*R2D);
                                                                                                                                        }
                                                                                                                                        function distKm(lat1,lon1,lat2,lon2){
                                                                                                                                          const p1=lat1*D2R,p2=lat2*D2R,dp=p2-p1,dl=(lon2-lon1)*D2R;
                                                                                                                                            const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
                                                                                                                                              return 12742*Math.asin(Math.sqrt(a));
                                                                                                                                              }
                                                                                                                                              function greatCircle(lat1,lon1,lat2,lon2,n=80){
                                                                                                                                                const p1=lat1*D2R,l1=lon1*D2R,p2=lat2*D2R,l2=lon2*D2R;
                                                                                                                                                  const d=2*Math.asin(Math.sqrt(Math.sin((p2-p1)/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin((l2-l1)/2)**2));
                                                                                                                                                    const pts=[];
                                                                                                                                                      for(let i=0;i<=n;i++){
                                                                                                                                                          const f=i/n,A=Math.sin((1-f)*d)/Math.sin(d),B=Math.sin(f*d)/Math.sin(d);
                                                                                                                                                              const x=A*Math.cos(p1)*Math.cos(l1)+B*Math.cos(p2)*Math.cos(l2);
                                                                                                                                                                  const y=A*Math.cos(p1)*Math.sin(l1)+B*Math.cos(p2)*Math.sin(l2);
                                                                                                                                                                      const z=A*Math.sin(p1)+B*Math.sin(p2);
                                                                                                                                                                          pts.push([Math.atan2(z,Math.hypot(x,y))*R2D,Math.atan2(y,x)*R2D]);
                                                                                                                                                                            }
                                                                                                                                                                              return pts;
                                                                                                                                                                              }
                                                                                                                                                                              // W3C örneği: eğim telafili pusula yönü (Android)
                                                                                                                                                                              function compassHeading(alpha,beta,gamma){
                                                                                                                                                                                const x=beta*D2R,y=gamma*D2R,z=alpha*D2R;
                                                                                                                                                                                  const cY=Math.cos(y),cZ=Math.cos(z),sX=Math.sin(x),sY=Math.sin(y),sZ=Math.sin(z);
                                                                                                                                                                                    const Vx=-cZ*sY-sZ*sX*cY, Vy=-sZ*sY+cZ*sX*cY;
                                                                                                                                                                                      let h=Math.atan(Vx/Vy);
                                                                                                                                                                                        if(Vy<0)h+=Math.PI; else if(Vx<0)h+=2*Math.PI;
                                                                                                                                                                                          return h*R2D;
                                                                                                                                                                                          }

                                                                                                                                                                                          // ---------- Harita ----------
                                                                                                                                                                                          const map = L.map('map',{zoomControl:false,attributionControl:true}).setView([36.05,35.97],15);
                                                                                                                                                                                          const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
                                                                                                                                                                                          const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});
                                                                                                                                                                                          osm.addTo(map);
                                                                                                                                                                                          let isSat=false;
                                                                                                                                                                                          $('layer').onclick=()=>{isSat?(map.removeLayer(sat),osm.addTo(map)):(map.removeLayer(osm),sat.addTo(map));isSat=!isSat;$('layer').textContent=isSat?'Harita':'Uydu';};

                                                                                                                                                                                          const meIcon = L.divIcon({className:'',iconSize:[44,44],iconAnchor:[22,22],html:
                                                                                                                                                                                           '<div class="me"><svg class="cone" viewBox="0 0 44 44"><defs><radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2f8cff" stop-opacity=".75"/><stop offset="1" stop-color="#2f8cff" stop-opacity="0"/></radialGradient></defs><path d="M22 22L7 0A30 30 0 0 1 37 0Z" fill="url(#g)"/></svg><div class="dot"></div></div>'});
                                                                                                                                                                                           const kaabaIcon = L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],html:'<div class="kaaba"></div>'});
                                                                                                                                                                                           let meMarker=null, accCircle=null, qLine=null, hLine=null;
                                                                                                                                                                                           L.marker([KAABA.lat,KAABA.lon],{icon:kaabaIcon}).addTo(map);

                                                                                                                                                                                           // ---------- Durum ----------
                                                                                                                                                                                           let pos=null, heading=null, smooth=null, qb=null, follow=true, compassAcc=null;
                                                                                                                                                                                           const decl = () => parseFloat($('decl').value)||0;
                                                                                                                                                                                           try{const s=localStorage.getItem('decl'); if(s!==null)$('decl').value=s;}catch(e){}
                                                                                                                                                                                           $('decl').onchange=()=>{try{localStorage.setItem('decl',$('decl').value)}catch(e){} render();};
                                                                                                                                                                                           map.on('dragstart',()=>follow=false);
                                                                                                                                                                                           $('center').onclick=()=>{follow=true;if(pos)map.setView([pos.lat,pos.lon],Math.max(map.getZoom(),17));};
                                                                                                                                                                                           $('both').onclick=()=>{follow=false;if(pos)map.fitBounds([[pos.lat,pos.lon],[KAABA.lat,KAABA.lon]],{padding:[30,30]});};

                                                                                                                                                                                           function onPos(p){
                                                                                                                                                                                             pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
                                                                                                                                                                                               qb=bearing(pos.lat,pos.lon,KAABA.lat,KAABA.lon);
                                                                                                                                                                                                 const ll=[pos.lat,pos.lon];
                                                                                                                                                                                                   if(!meMarker){
                                                                                                                                                                                                       meMarker=L.marker(ll,{icon:meIcon,zIndexOffset:1000}).addTo(map);
                                                                                                                                                                                                           accCircle=L.circle(ll,{radius:pos.acc,color:'#2f8cff',weight:1,fillOpacity:.1}).addTo(map);
                                                                                                                                                                                                               qLine=L.polyline(greatCircle(pos.lat,pos.lon,KAABA.lat,KAABA.lon),{color:'#e0b84f',weight:4}).addTo(map);
                                                                                                                                                                                                                   hLine=L.polyline([ll,ll],{color:'#2f8cff',weight:3,dashArray:'6 6'}).addTo(map);
                                                                                                                                                                                                                       map.setView(ll,17);
                                                                                                                                                                                                                         }else{
                                                                                                                                                                                                                             meMarker.setLatLng(ll); accCircle.setLatLng(ll).setRadius(pos.acc);
                                                                                                                                                                                                                                 qLine.setLatLngs(greatCircle(pos.lat,pos.lon,KAABA.lat,KAABA.lon));
                                                                                                                                                                                                                                     if(follow)map.panTo(ll,{animate:true});
                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                         $('qb').textContent=qb.toFixed(1)+'°';
                                                                                                                                                                                                                                           $('ds').textContent=Math.round(distKm(pos.lat,pos.lon,KAABA.lat,KAABA.lon)).toLocaleString('tr-TR')+' km';
                                                                                                                                                                                                                                             $('ac').textContent='±'+Math.round(pos.acc)+' m';
                                                                                                                                                                                                                                               render();
                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                               function onPosErr(e){
                                                                                                                                                                                                                                                 $('status').textContent='Konum alınamadı: '+e.message;
                                                                                                                                                                                                                                                   $('status').className='warn';
                                                                                                                                                                                                                                                   }

                                                                                                                                                                                                                                                   function onHeading(h){
                                                                                                                                                                                                                                                     const angle=(screen.orientation&&screen.orientation.angle)||0;
                                                                                                                                                                                                                                                       h=norm(h+angle);
                                                                                                                                                                                                                                                         // dairesel yumuşatma
                                                                                                                                                                                                                                                           if(smooth===null)smooth=h; else smooth=norm(smooth+sdiff(h-smooth)*0.18);
                                                                                                                                                                                                                                                             heading=smooth; render();
                                                                                                                                                                                                                                                             }
                                                                                                                                                                                                                                                             function onOrient(e){
                                                                                                                                                                                                                                                               if(typeof e.webkitCompassHeading==='number'){            // iOS
                                                                                                                                                                                                                                                                   if(e.webkitCompassAccuracy!==undefined)compassAcc=e.webkitCompassAccuracy;
                                                                                                                                                                                                                                                                       onHeading(e.webkitCompassHeading);
                                                                                                                                                                                                                                                                         }else if(e.alpha!==null&&e.beta!==null&&e.gamma!==null){  // Android
                                                                                                                                                                                                                                                                             if(e.type==='deviceorientationabsolute'||e.absolute===true)
                                                                                                                                                                                                                                                                                   onHeading(compassHeading(e.alpha,e.beta,e.gamma));
                                                                                                                                                                                                                                                                                     }
                                                                                                                                                                                                                                                                                     }

                                                                                                                                                                                                                                                                                     let wasOk=false;
                                                                                                                                                                                                                                                                                     function render(){
                                                                                                                                                                                                                                                                                       if(heading===null){ if(pos)$('status').textContent='Pusula bekleniyor…'; return; }
                                                                                                                                                                                                                                                                                         const trueH=norm(heading+decl());
                                                                                                                                                                                                                                                                                           $('hd').textContent=trueH.toFixed(0)+'°';
                                                                                                                                                                                                                                                                                             $('ring').setAttribute('transform','rotate('+(-trueH)+')');
                                                                                                                                                                                                                                                                                               if(meMarker){
                                                                                                                                                                                                                                                                                                   const c=meMarker.getElement().querySelector('.cone'); if(c)c.style.transform='rotate('+trueH+'deg)';
                                                                                                                                                                                                                                                                                                       const a=trueH*D2R, d=0.0012; // ~130 m
                                                                                                                                                                                                                                                                                                           hLine.setLatLngs([[pos.lat,pos.lon],[pos.lat+Math.cos(a)*d,pos.lon+Math.sin(a)*d/Math.cos(pos.lat*D2R)]]);
                                                                                                                                                                                                                                                                                                             }
                                                                                                                                                                                                                                                                                                               if(qb===null)return;
                                                                                                                                                                                                                                                                                                                 $('qmark').setAttribute('transform','rotate('+qb+')');
                                                                                                                                                                                                                                                                                                                   const d=sdiff(qb-trueH);
                                                                                                                                                                                                                                                                                                                     $('df').textContent=(d>0?'+':'')+d.toFixed(0)+'°';
                                                                                                                                                                                                                                                                                                                       const st=$('status'), ad=Math.abs(d);
                                                                                                                                                                                                                                                                                                                         if(ad<=3){
                                                                                                                                                                                                                                                                                                                             st.textContent='Kıbleye dönüksün ✓'; st.className='ok';
                                                                                                                                                                                                                                                                                                                                 if(!wasOk&&navigator.vibrate)navigator.vibrate(40); wasOk=true;
                                                                                                                                                                                                                                                                                                                                   }else{
                                                                                                                                                                                                                                                                                                                                       wasOk=false; st.className='';
                                                                                                                                                                                                                                                                                                                                           st.textContent=(d>0?'Sağa ':'Sola ')+ad.toFixed(0)+'° dön';
                                                                                                                                                                                                                                                                                                                                             }
                                                                                                                                                                                                                                                                                                                                               if((compassAcc!==null&&compassAcc>20)||(pos&&pos.acc>50)){
                                                                                                                                                                                                                                                                                                                                                   st.textContent+='  (sensör hassasiyeti düşük)'; if(!st.classList.contains('ok'))st.classList.add('warn');
                                                                                                                                                                                                                                                                                                                                                     }
                                                                                                                                                                                                                                                                                                                                                     }

                                                                                                                                                                                                                                                                                                                                                     // ---------- Başlat ----------
                                                                                                                                                                                                                                                                                                                                                     $('startBtn').onclick=async()=>{
                                                                                                                                                                                                                                                                                                                                                       const err=$('err'); err.textContent='';
                                                                                                                                                                                                                                                                                                                                                         if(!window.isSecureContext){
                                                                                                                                                                                                                                                                                                                                                             err.textContent='Bu sayfa güvenli (https://) bağlantıyla açılmamış, o yüzden tarayıcı izin sormuyor. Sayfayı Netlify/GitHub Pages linkiyle, Safari veya Chrome\'da aç.';
                                                                                                                                                                                                                                                                                                                                                                 return;
                                                                                                                                                                                                                                                                                                                                                                   }
                                                                                                                                                                                                                                                                                                                                                                     if(window.top!==window.self){
                                                                                                                                                                                                                                                                                                                                                                         err.textContent='Sayfa başka bir sayfanın içinde (önizleme) açılmış, izin sorulamaz. Linki doğrudan Safari/Chrome\'da aç.';
                                                                                                                                                                                                                                                                                                                                                                             return;
                                                                                                                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                                                                                                                                 // İki izin de kullanıcı dokunuşunun içinde, bekletmeden başlatılır
                                                                                                                                                                                                                                                                                                                                                                                   let orientPromise=Promise.resolve('granted');
                                                                                                                                                                                                                                                                                                                                                                                     if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
                                                                                                                                                                                                                                                                                                                                                                                         orientPromise=DeviceOrientationEvent.requestPermission().catch(()=> 'denied');
                                                                                                                                                                                                                                                                                                                                                                                           }
                                                                                                                                                                                                                                                                                                                                                                                             window.addEventListener('deviceorientationabsolute',onOrient,true);
                                                                                                                                                                                                                                                                                                                                                                                               window.addEventListener('deviceorientation',onOrient,true);
                                                                                                                                                                                                                                                                                                                                                                                                 let geoMsg='';
                                                                                                                                                                                                                                                                                                                                                                                                   const geoPromise=new Promise(res=>{
                                                                                                                                                                                                                                                                                                                                                                                                       navigator.geolocation.watchPosition(p=>{onPos(p);res('');},e=>{
                                                                                                                                                                                                                                                                                                                                                                                                             onPosErr(e);
                                                                                                                                                                                                                                                                                                                                                                                                                   res(e.code===1?'Konum izni reddedildi. iPhone: Ayarlar > Gizlilik > Konum Servisleri > Safari (veya Chrome) > "Uygulamayı Kullanırken". Android: tarayıcı adres çubuğundaki kilit simgesi > İzinler > Konum > İzin ver. Sonra sayfayı yenile.':'Konum alınamadı: '+e.message);
                                                                                                                                                                                                                                                                                                                                                                                                                       },{enableHighAccuracy:true,maximumAge:0,timeout:20000});
                                                                                                                                                                                                                                                                                                                                                                                                                         });
                                                                                                                                                                                                                                                                                                                                                                                                                           const o=await orientPromise;
                                                                                                                                                                                                                                                                                                                                                                                                                             let msg='';
                                                                                                                                                                                                                                                                                                                                                                                                                               if(o!=='granted'){
                                                                                                                                                                                                                                                                                                                                                                                                                                   msg='Yön sensörü izni verilmedi. iPhone: Safari\'yi tamamen kapat, linki tekrar aç ve çıkan "Hareket ve Yön" sorusuna İzin Ver de. Sorulmuyorsa Ayarlar > Safari > Gelişmiş > Web Sitesi Verileri\'nden bu siteyi sil.';
                                                                                                                                                                                                                                                                                                                                                                                                                                     }
                                                                                                                                                                                                                                                                                                                                                                                                                                       const g=await Promise.race([geoPromise,new Promise(r=>setTimeout(()=>r('__wait'),4000))]);
                                                                                                                                                                                                                                                                                                                                                                                                                                         if(g&&g!=='__wait')msg=(msg?msg+'\n\n':'')+g;
                                                                                                                                                                                                                                                                                                                                                                                                                                           if(msg){err.style.whiteSpace='pre-line';err.textContent=msg;}
                                                                                                                                                                                                                                                                                                                                                                                                                                             if(!msg||o==='granted'){ $('start').style.display='none'; map.invalidateSize(); }
                                                                                                                                                                                                                                                                                                                                                                                                                                               try{await navigator.wakeLock.request('screen')}catch(e){}
                                                                                                                                                                                                                                                                                                                                                                                                                                               };
                                                                                                                                                                                                                                                                                                                                                                                                                                               document.addEventListener('visibilitychange',async()=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                 if(!document.hidden){try{await navigator.wakeLock.request('screen')}catch(e){}}
                                                                                                                                                                                                                                                                                                                                                                                                                                                 });
                                                                                                                                                                                                                                                                                                                                                                                                                                                 </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                 </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                 </html>
